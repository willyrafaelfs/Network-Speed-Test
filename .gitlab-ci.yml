# Pipeline GitLab: setara dengan .github/workflows/ci.yml.
# Image JDK polos + Android command-line tools; AGP mengunduh platform & build-tools
# yang dibutuhkan secara otomatis setelah lisensi diterima. SDK di-cache antar pipeline.

image: eclipse-temurin:21-jdk

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Hindari pipeline ganda saat branch sudah punya merge request terbuka.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  # cmdline-tools 19.0. Versi yang lebih baru mengganti sdkmanager dengan CLI `android`
  # dan tidak lagi menerima lisensi lewat `sdkmanager --licenses`.
  ANDROID_CMDLINE_TOOLS_VERSION: "13114758"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DEBIAN_FRONTEND: noninteractive

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .gradle-home/caches/
    - .gradle-home/wrapper/
    - .android-sdk/

stages:
  - verify
  - build
  - release

before_script:
  - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip > /dev/null
  # Folder dinamai sesuai versi agar SDK hasil cache dari versi lain tidak terpakai.
  - export SDKMANAGER="$ANDROID_HOME/cmdline-tools/$ANDROID_CMDLINE_TOOLS_VERSION/bin/sdkmanager"
  - |
    if [ ! -x "$SDKMANAGER" ]; then
      curl -fsSL -o /tmp/cmdline-tools.zip \
        "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip"
      mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/cmdline-tools
      unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
      mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/$ANDROID_CMDLINE_TOOLS_VERSION"
    fi
  # `yes` dihentikan SIGPIPE saat sdkmanager selesai; abaikan agar tidak gagal di bawah pipefail.
  - (yes || true) | "$SDKMANAGER" --licenses > /dev/null
  - chmod +x ./gradlew

static-analysis:
  stage: verify
  script:
    - ./gradlew spotlessCheck detekt lintDebug
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/reports/
      - app/build/reports/

unit-tests:
  stage: verify
  script:
    # Unit + Robolectric (DAO & UI), verifikasi screenshot Roborazzi, dan coverage per layer.
    - ./gradlew verifyRoborazziDebug koverHtmlReportDebug :app:coverageSummary
  # Angka coverage untuk badge & tampilan pipeline, dibaca dari log coverageSummary.
  coverage: '/Total line coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - app/build/reports/kover/
      - app/build/outputs/roborazzi/
    reports:
      junit: app/build/test-results/testDebugUnitTest/TEST-*.xml

assemble:
  stage: build
  script:
    # Release (R8, tanpa tanda tangan di GitLab) ikut dibangun agar kerusakan minify ketahuan.
    - ./gradlew assembleDebug assembleRelease
  artifacts:
    expire_in: 1 week
    paths:
      - app/build/outputs/apk/debug/

# Membuat GitLab Release untuk setiap tag vX.Y.Z setelah verifikasi & build lolos.
# Catatan rilis diambil dari pesan annotated tag (`git tag -a`), sehingga isinya sama
# dengan GitHub Release. Token yang dipakai adalah CI_JOB_TOKEN bawaan pipeline.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  # Tidak butuh Android SDK maupun cache Gradle.
  before_script: []
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - |
      if [ -z "$CI_COMMIT_TAG_MESSAGE" ]; then
        echo "Tag $CI_COMMIT_TAG tidak punya pesan. Gunakan annotated tag: git tag -a $CI_COMMIT_TAG" >&2
        exit 1
      fi
    # Ditulis ke file, bukan diteruskan langsung: runner tidak meng-escape description,
    # sehingga tanda kutip di catatan rilis memecah argumen glab (gagal di v1.3.0).
    - printf '%s\n' "$CI_COMMIT_TAG_MESSAGE" > release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
    # APK bertanda tangan dibangun sekali di GitHub Actions (kunci hanya ada di GitHub
    # Secrets); GitLab Release menautkannya.
    assets:
      links:
        - name: netra-$CI_COMMIT_TAG.apk
          url: https://github.com/willyrafaelfs/Network-Speed-Test/releases/download/$CI_COMMIT_TAG/netra-$CI_COMMIT_TAG.apk
          link_type: package
        - name: netra-$CI_COMMIT_TAG.apk.sha256
          url: https://github.com/willyrafaelfs/Network-Speed-Test/releases/download/$CI_COMMIT_TAG/netra-$CI_COMMIT_TAG.apk.sha256
          link_type: other
