name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Verify & build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (Spotless, Detekt, Android Lint)
        run: ./gradlew spotlessCheck detekt lintDebug

      # Satu eksekusi test sekaligus: unit, Robolectric (DAO & UI), verifikasi screenshot
      # Roborazzi, laporan coverage Kover, dan pengecekan target coverage per layer.
      - name: Tests, screenshots & coverage
        run: ./gradlew verifyRoborazziDebug koverHtmlReportDebug :app:coverageSummary | tee coverage.log

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            sed -n '/^Layer/,/^Total line coverage/p' coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
