name: Release

# Push tag vX.Y.Z -> APK rilis bertanda tangan -> GitHub Release berisi catatan dari pesan
# annotated tag, changelog otomatis (PR yang masuk sejak tag sebelumnya), APK, dan SHA-256.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Riwayat penuh + objek tag agar pesan annotated tag bisa dibaca.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NETRA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret NETRA_KEYSTORE_BASE64 belum diisi" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netra-release.jks"

      - name: Build release APK
        env:
          NETRA_KEYSTORE_PATH: ${{ runner.temp }}/netra-release.jks
          NETRA_KEYSTORE_PASSWORD: ${{ secrets.NETRA_KEYSTORE_PASSWORD }}
          NETRA_KEY_ALIAS: ${{ secrets.NETRA_KEY_ALIAS }}
          NETRA_KEY_PASSWORD: ${{ secrets.NETRA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature & prepare assets
        run: |
          APK="netra-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Gagal bila APK tidak bertanda tangan atau tanda tangannya rusak.
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.log
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.log
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          TITLE=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file notes.md \
            --generate-notes
          # Mapping R8 untuk membaca stack trace dari APK ter-obfuscate.
          gh release upload "$GITHUB_REF_NAME" app/build/outputs/mapping/release/mapping.txt#mapping.txt
